version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: fraudshield-postgres
    environment:
      POSTGRES_DB: fraudshield
      POSTGRES_USER: fraudshield
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fraudshield-network

  redis:
    image: redis:7-alpine
    container_name: fraudshield-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - fraudshield-network

  backend:
    build: ./backend
    container_name: fraudshield-backend
    environment:
      DATABASE_URL: postgresql://fraudshield:${DB_PASSWORD}@postgres:5432/fraudshield
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
      - model_data:/app/models
    networks:
      - fraudshield-network

  frontend:
    build: ./frontend
    container_name: fraudshield-frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:5000/api/v1
      REACT_APP_STRIPE_PUBLIC_KEY: ${STRIPE_PUBLIC_KEY}
    depends_on:
      - backend
    networks:
      - fraudshield-network

  nginx:
    image: nginx:alpine
    container_name: fraudshield-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - backend
      - frontend
    networks:
      - fraudshield-network

  prometheus:
    image: prom/prometheus:latest
    container_name: fraudshield-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - fraudshield-network

  grafana:
    image: grafana/grafana:latest
    container_name: fraudshield-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - fraudshield-network

volumes:
  postgres_data:
  redis_data:
  model_data:
  prometheus_data:
  grafana_data:

networks:
  fraudshield-network:
    driver: bridge