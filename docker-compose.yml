# docker-compose.yml
version: '3.8'

services:
  fraudshield:
    build: .
    container_name: fraudshield_app
    ports:
      - "5000:5000"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - DATABASE_URL=sqlite:///fraudshield.db
    volumes:
      - ./fraudshield.db:/app/fraudshield.db
      - ./models:/app/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: Redis for production rate limiting
  redis:
    image: redis:7-alpine
    container_name: fraudshield_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Optional: PostgreSQL for production database
  postgres:
    image: postgres:15-alpine
    container_name: fraudshield_db
    environment:
      - POSTGRES_USER=fraudshield
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=fraudshield
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

volumes:
  postgres_data: